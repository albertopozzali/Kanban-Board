<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
</head>
<body>
   <h1>Kanban Board</h1>
   <p>Organizza tutte le attività del gruppo</p>

<form id="formAttivita">
            <label for="titolo">Titolo</label>
            <input type="text" id="titolo"> <br> <br>
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione"> <br> <br>
            <label for="priorita">Priorità</label>
            <select id="priorita">
                <option value="Nulla" selected>--</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Bassa">Bassa</option>
            </select> <br>  <br>
            <label for="assegnatario">Assegnatario</label>
            <input type="text" id="assegnatario"> <br>  <br>
        <button type="submit">Aggiungi attività</button>
    </form>
  
<p id="errore"></p>

  <label for="filtroPriorita">Filtra per priorità</label>
        <select id="filtroPriorita">
            <option value="Tutte">Tutte</option>
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Bassa">Bassa</option>
        </select>

    <section class="colonna" id="daFare">
    <h2>Da fare <span class="conteggio">0</span></h2>
    <section class="lista"></section>
    </section>

    <section class="colonna" id="inCorso">
    <h2>In corso <span class="conteggio">0</span></h2>
    <section class="lista"></section>
    </section>

    <section class="colonna" id="completato">
    <h2>Completato <span class="conteggio">0</span></h2>
    <section class="lista"></section>
    </section>
</body>
</html>
