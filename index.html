<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <script src="index.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>MyKanban</h1>
   <p>Il tuo lavoro, sotto controllo.</p>

<form id="formAttivita">
            <label for="titolo">Titolo</label>
            <input type="text" id="titolo" required> <br><br>
            <label for="descrizione">Descrizione</label>
            <input type="text" id="descrizione" required> <br><br>
            <label for="priorita">Priorità</label>
            <select id="priorita" required>
                <option value="Nulla" selected>--</option>
                <option value="Alta">Alta</option>
                <option value="Media">Media</option>
                <option value="Bassa">Bassa</option>
            </select> <br> <br>
            <label for="assegnatario">Assegnatario</label>
            <input type="text" id="assegnatario" required> <br><br>
        <button type="submit">Aggiungi attività</button>
    </form>
  
<p id="errore"></p>

  <label for="filtroPriorita">Filtra per priorità</label>
        <select id="filtroPriorita">
            <option value="Tutte">Tutte</option>
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Bassa">Bassa</option>
        </select>

    <section class="colonna" id="daFare">
    <h2>Da fare <span id="contDaFare">0</span></h2>
    <section id="listaDaFare"></section>
    </section>

    <section class="colonna" id="inCorso">
    <h2>In corso <span id="contInCorso">0</span></h2>
    <section id="listaInCorso"></section>
    </section>

    <section class="colonna" id="completato">
    <h2>Completato <span id="contCompletato">0</span></h2>
    <section id="listaCompletato"></section>
    </section>
</body>
</html>
